                  token: 0e77ecf9-feab-485a-8ce4-6427f9d3531d
                  permissions_reserve:
                    - staff_code: s001
                      manager_permission_reservation_date: 2023/2/3
                      reservation_manager_permission_name: 管理権限－編集
                      manage_organization_reservation_registration_or_cancel: 登録
                      reservation_manage_organization_path: 組織1
                      manage_subordinate_organizations: 下位組織を管理対象にしない
                      manage_organization_reservation_date: 2023/2/3
                      manage_organization_reservation_add_or_delete: 追加
      responses:
        '200':
          description: 処理成功時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStaffs'
              examples:
                succeeded:
                  value:
                    success: true
                    response:
                      login_company_code: test001
                      staffs:
                        - staff_id: 51
                          staff_code: i001
                          email: null
        default:
          description: 処理失敗時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseFailure'
              examples:
                processingFailed:
                  value:
                    success: false
                    errors:
                      - code: ERR300402
                        message: 組織が存在しません。
  /{login_company_code}/manhours:
    get:
      operationId: getLoginCompanyCodeManhours
      summary: 工数取得 (一覧)。
      tags:
        - manhours
      description: |
        工数実績の情報取得を一覧で行う。

        開始日時、終了日時が指定無しなら実行月の月初日から月末日を選択する。
      security:
        - tokenQuery: []
      parameters:
        - in: path
          name: login_company_code
          required: true
          description: 企業のログイン企業 ID。
          schema:
            type: string
        - in: query
          name: start_date
          required: false
          description: 工数取得期間の開始日時。指定無しなら実行月の月初日を選択する。
          schema:
            type: string
          example: '20190801'
        - in: query
          name: end_date
          required: false
          description: 工数取得期間の終了日時。指定無しなら実行月の月末日を選択する。
          schema:
            type: string
          example: '20190831'
      responses:
        '200':
          description: 処理成功時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseManhours'
              examples:
                succeeded:
                  value:
                    success: true
                    response:
                      manhours:
                        - staff_id: 200
                          dates:
                            - date: '2019-08-01'
                              projects:
                                - project_id: 100
                                  closed_at: null
                                  fixed_at: null
                                  daily_hour_items:
                                    - task_id: 150
                                      minute: 60
                                  daily_comment_items:
                                    - task_id: 150
                                      comment: 工数のコメントです。
                              staff_comment: 従業員のコメントです。
                              admin_comment: 管理者のコメントです。
        default:
          description: 処理失敗時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseFailure'
              examples:
                processingFailed:
                  value:
                    success: false
                    errors:
                      - code: ERR300402
                        message: 組織が存在しません。
    post:
      operationId: postLoginCompanyCodeManhours
      summary: 工数作成更新。
      tags:
        - manhours
      description: |
        工数実績を作成、または更新する。
      security: []
      parameters:
        - in: path
          name: login_company_code
          required: true
          description: 企業のログイン企業 ID。
          schema:
            type: string
      requestBody:
        description: 作成、または更新する工数の情報。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPostManhours'
            examples:
              normal:
                value:
                  token: xxxxxxxxxxxxxxxx
                  manhours:
                    - staff_id: 200
                      dates:
                        - date: 2019/08/03
                          projects:
                            - project_id: 100
                              daily_hour_items:
                                - task_id: 150
                                  minute: 60
      responses:
        '200':
          description: 処理成功時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseManhours'
              examples:
                succeeded:
                  value:
                    success: true
                    response:
                      manhours:
                        - staff_id: 200
                          dates:
                            - date: '2019-08-01'
                              projects:
                                - project_id: 100
                                  closed_at: null
                                  fixed_at: null
                                  daily_hour_items:
                                    - task_id: 150
                                      minute: 60
                                  daily_comment_items:
                                    - task_id: 150
                                      comment: 工数のコメントです。
                              staff_comment: 従業員のコメントです。
                              admin_comment: 管理者のコメントです。
        default:
          description: 処理失敗時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseFailure'
              examples:
                processingFailed:
                  value:
                    success: false
                    errors:
                      - code: ERR300402
                        message: 組織が存在しません。
