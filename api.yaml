openapi: 3.2.1
info:
  version: 0.1.0
  title: AKASHI (マネーフォワード クラウド勤怠Plus) 公開API
  description: |
    # akashi-openapi

    AKASHI (マネーフォワード クラウド勤怠 Plus) 公開 API の OpenAPI 定義。

    [公開 API 仕様](https://akashi.zendesk.com/hc/ja/articles/115000475854) を元に作成している。

    ## 基本的な使い方

    エンドポイントにアクセストークンを付加のうえリクエストを送信することで、各 API に応じた機能を利用できる。
    エンドポイントのドメインはログイン後 URL のドメインを確認して指定する。

    ## 認証

    - GET 系の API はクエリパラメータ `token` にアクセストークンを指定する。
    - POST/PATCH/DELETE 系の API はリクエストボディの `token` プロパティにアクセストークンを指定する。

    アクセストークンはマイページから発行する。有効期限は 1 ヶ月と 1 日である。
    再発行はマイページ、またはアクセストークン再発行 API を利用する。

    ## 共通仕様

    - 各 API はアクセストークンに紐づいた従業員の権限によって実行が許可、または却下される。
    - 処理成否のレスポンスは JSON とし、成功時は `success` が true となり `response` に処理結果が格納される。
    - 失敗時は `success` が false となり `errors` にエラーメッセージの配列が格納される。
    - 値が無い場合のレスポンスは String/Integer/Object が null、Array が空配列となる。Boolean は必ず true/false が設定される。
servers:
  - url: https://atnd.ak4.jp/api/cooperation
    description: Production Server
  - url: https://atnd-awj.ak4.jp/api/cooperation
    description: Production Server (awj)
paths:
  /token/reissue/{login_company_code}:
    post:
      operationId: postTokenReissueLoginCompanyCode
      summary: アクセストークン再発行。
      tags:
        - token
      description: |
        トークンにて認証した従業員のアクセストークンを再発行する。

        再発行時に有効期限切れのトークンが存在する場合、自動的に削除される。
      security: []
      parameters:
        - in: path
          name: login_company_code
          required: true
          description: ログイン企業 ID。
          schema:
            type: string
      requestBody:
        description: 再発行の情報。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPostTokenReissue'
            examples:
              normal:
                value:
                  token: xxxxxxxxxxxxxxxx
      responses:
        '200':
          description: 処理成功時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsePostTokenReissue'
              examples:
                succeeded:
                  value:
                    success: true
                    response:
                      login_company_code: sample001
                      staff_id: 123
                      agency_manager_id: 45
                      token: xxxxxxxxxxxxxxxxxxxxxxxx
                      expired_at: 2017/10/09 00:00:00
        default:
          description: 処理失敗時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseFailure'
              examples:
                processingFailed:
                  value:
                    success: false
                    errors:
                      - code: ERR300402
                        message: 組織が存在しません。
  /working_statuses/search:
    post:
      operationId: postWorkingStatusesSearch
      summary: 勤務処理取得。
      tags:
        - workingStatuses
      description: |
        管理下の従業員の勤務処理を取得する。

        勤務処理取得リストは最大 1,000 件まで指定できる。
      security: []
      requestBody:
        description: 勤務処理の取得対象の情報。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPostWorkingStatusesSearch'
            examples:
              normal:
                value:
                  token: xxxxxxxxxxxxxxxx
                  search:
                    - staff_id: '1'
                      date: '2026-01-01'
                    - staff_id: '14'
                      date: '2025-12-02'
      responses:
        '200':
          description: 処理成功時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsePostWorkingStatusesSearch'
              examples:
                succeeded:
                  value:
                    success: true
                    results:
                      - staff_id: '1'
                        date: '2026-01-01'
                        working_statuses:
                          - 欠勤
                      - staff_id: '14'
                        date: '2025-12-02'
                        working_statuses:
                          - 出張
                    errors: []
        default:
          description: 処理失敗時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseFailure'
              examples:
                processingFailed:
                  value:
                    success: false
                    errors:
                      - code: ERR300402
                        message: 組織が存在しません。
  /working_statuses/update:
    post:
      operationId: postWorkingStatusesUpdate
      summary: 勤務処理更新。
      tags:
        - workingStatuses
      description: |
        管理下の従業員の勤務処理を更新する。

        勤務処理更新リストは最大 1,000 件まで指定できる。カスタム勤務処理リストに登録済みのラベルのみ指定できる。
      security: []
      requestBody:
        description: 勤務処理の更新対象の情報。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPostWorkingStatusesUpdate'
            examples:
              normal:
                value:
                  token: 1962f066-7024-4a00-bde9-1cb35f2309c1
                  update:
                    - staff_id: '1'
                      date: '2026-02-02'
                      working_statuses:
                        - 直帰
                        - 早退
                      replace: true
                    - staff_id: '1'
                      date: '2026-02-03'
                      working_statuses: []
                      replace: true
                    - staff_id: '1'
                      date: '2026-02-04'
                      working_statuses:
                        - 遅刻
                      replace: false
                      if_not:
                        - テレワーク
      responses:
        '200':
          description: 処理成功時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsePostWorkingStatusesUpdate'
              examples:
                succeeded:
                  value:
                    success: true
                    errors: null
        default:
          description: 処理失敗時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseFailure'
              examples:
                processingFailed:
                  value:
                    success: false
                    errors:
                      - code: ERR300402
                        message: 組織が存在しません。
