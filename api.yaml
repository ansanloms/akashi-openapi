        '200':
          description: 処理成功時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseGetAlerts'
              examples:
                succeeded:
                  value:
                    success: true
                    response:
                      login_company_code: sample001
                      staff_id: 123
                      count: 3
                      alerts:
                        - month: 2017/03/01
                          date: 2017/04/15
                          alert_type: 1
                        - month: 2017/04/01
                          date: 2017/04/16
                          alert_type: 2
                        - month: 2017/04/01
                          date: 2017/04/16
                          alert_type: 6
        default:
          description: 処理失敗時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseFailure'
              examples:
                processingFailed:
                  value:
                    success: false
                    errors:
                      - code: ERR300402
                        message: 組織が存在しません。
  /{login_company_code}/importer_factory/organizations:
    post:
      operationId: postLoginCompanyCodeImporterFactoryOrganizations
      summary: 異動日を指定した異動。
      tags:
        - importerFactory
      description: |
        異動日を指定して従業員の組織/雇用区分を異動させる。
      security: []
      parameters:
        - in: path
          name: login_company_code
          required: true
          description: 企業のログイン企業 ID。
          schema:
            type: string
      requestBody:
        description: 異動の情報。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPostImporterFactoryOrganizations'
            examples:
              normal:
                value:
                  token: xxxxxxxxxxxxxxxx
                  organizations:
                    - staff_code: s001
                      organization_change_date: 2023/2/1
                      is_delete_change_history_after_change_date: 'YES'
                      new_organization_path: 組織A
                      employment_category: 正社員
                      sub_organization_code: org002
                    - staff_email: s002@example.com
                      organization_change_date: 2023/2/2
                      is_delete_change_history_after_change_date: 'NO'
                      employment_category: 正社員
                      new_organization_code: org002
                      sub_organization_path: 組織A
      responses:
        '200':
          description: 処理成功時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStaffs'
              examples:
                succeeded:
                  value:
                    success: true
                    response:
                      login_company_code: test001
                      staffs:
                        - staff_id: 51
                          staff_code: i001
                          email: null
        default:
          description: 処理失敗時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseFailure'
              examples:
                processingFailed:
                  value:
                    success: false
                    errors:
                      - code: ERR300402
                        message: 組織が存在しません。
  /{login_company_code}/importer_factory/permissions:
    post:
      operationId: postLoginCompanyCodeImporterFactoryPermissions
      summary: 権限と管理先指定。
      tags:
        - importerFactory
      description: |
        管理権限設定と管理先を指定する。

        管理対象従業員番号は `managed_staff_code1` や `managed_staff_code2` など、末尾に数字を付けることで複数指定できる。
      security: []
      parameters:
        - in: path
          name: login_company_code
          required: true
          description: 企業のログイン企業 ID。
          schema:
            type: string
      requestBody:
        description: 管理権限設定の指定と管理先の指定の情報。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPostImporterFactoryPermissions'
            examples:
              normal:
                value:
                  token: 0e77ecf9-feab-485a-8ce4-6427f9d3531d
                  permissions:
                    - staff_code: s001
                      manager_permission_name: 一般管理者
                      manage_organization_path: 組織１
                      manage_subordinate_organizations_immed_path: 下位組織を管理対象にしない
                      manage_organization_code: org002
                      manage_subordinate_organizations_immed_code: サブ組織所属を除く＋直下組織管理者を直接管理する
                      managed_staff_code1: s002
                      managed_staff_code2: s003
      responses:
        '200':
          description: 処理成功時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseStaffs'
              examples:
                succeeded:
                  value:
                    success: true
                    response:
                      login_company_code: test001
                      staffs:
                        - staff_id: 51
                          staff_code: i001
                          email: null
        default:
          description: 処理失敗時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseFailure'
              examples:
                processingFailed:
                  value:
                    success: false
                    errors:
                      - code: ERR300402
                        message: 組織が存在しません。
  /{login_company_code}/importer_factory/permissions_reserve:
    post:
      operationId: postLoginCompanyCodeImporterFactoryPermissionsReserve
      summary: 権限と管理先予約。
      tags:
