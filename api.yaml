        limited_weekly_28hours:
          type: string
          description: 週 28 時間労働制限。制限する/制限しない。シフト作成時のアラート表示が「利用する」の場合は必須。 プレミアムプラン以外の場合に入力値があっても無視する。
        max_continuous_working_days_per_month:
          type: string
          description: 連続勤務制限日数。整数 (2〜99)。シフト作成時のアラート表示が「利用する」の場合は必須。 プレミアムプラン以外の場合に入力値があっても無視する。
