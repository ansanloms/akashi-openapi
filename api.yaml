          type: string
          description: 月間労働時間。HH:MM (00:00〜99:00) を 1 月度から 12 月度までの順番に/区切りで指定する。 シフト作成時のアラート表示が「利用する」の場合は必須。 プレミアムプラン以外の場合に入力値があっても無視する。
        monthly_scheduled_holidays:
          type: string
          description: 月間休日日数。整数 (0〜99) を 1 月度から 12 月度までの順番に/区切りで指定する。 シフト作成時のアラート表示が「利用する」の場合は必須。 プレミアムプラン以外の場合に入力値があっても無視する。
        standard_working_hours:
          type: string
          description: 工数の基準となる労働時間。実働時間/総労働時間。プレミアムプラン以外の場合に入力値があっても無視する。
        allowed_minus:
          type: string
          description: 労働時間以上の工数入力。許容する/許容しない。プレミアムプラン以外の場合に入力値があっても無視する。
        hourly_wage:
          type: integer
