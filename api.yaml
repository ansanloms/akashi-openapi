components:
  schemas:
    Alert:
      type: object
      description: |
        アラート。
      properties:
        month:
          type: string
          description: アラートの発生した月度。
          example: 2017/03/01
        date:
          type: string
          description: アラートの発生した日付。
          example: 2017/04/15
        alert_type:
          $ref: '#/components/schemas/EnumAlertType'
          description: アラート種別。
    BreakTimeResult:
      type: object
      description: |
        休憩実績。
      properties:
        result_break_time_start_time:
          type: string
          description: 休憩開始時刻。
          example: 2018/09/03 12:00:00
        result_break_time_end_time:
          type: string
          description: 休憩終了時刻。
          example: 2018/09/03 13:00:00
        rounded_break_time_start_time:
          type: string
          description: 丸め休憩開始時刻。
          example: 2018/09/03 12:00:00
        rounded_break_time_end_time:
          type: string
          description: 丸め休憩終了時刻。
