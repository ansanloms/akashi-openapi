      security:
        - tokenQuery: []
      parameters:
        - in: path
          name: login_company_code
          required: true
          description: 企業のログイン企業 ID。
          schema:
            type: string
        - in: path
          name: staff_id
          required: true
          description: 従業員 ID。
          schema:
            type: integer
        - in: query
          name: start_date
          required: false
          description: 工数取得期間の開始日時。指定無しなら実行月の月初日を選択する。
          schema:
            type: string
          example: '20190801'
        - in: query
          name: end_date
          required: false
          description: 工数取得期間の終了日時。指定無しなら実行月の月末日を選択する。
          schema:
            type: string
          example: '20190831'
      responses:
        '200':
          description: 処理成功時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseManhours'
              examples:
                succeeded:
                  value:
                    success: true
                    response:
                      manhours:
                        - staff_id: 200
                          dates:
                            - date: '2019-08-01'
                              projects:
                                - project_id: 100
                                  closed_at: null
                                  fixed_at: null
                                  daily_hour_items:
                                    - task_id: 150
                                      minute: 60
                                  daily_comment_items:
                                    - task_id: 150
                                      comment: 工数のコメントです。
                              staff_comment: 従業員のコメントです。
                              admin_comment: 管理者のコメントです。
        default:
          description: 処理失敗時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseFailure'
              examples:
                processingFailed:
                  value:
                    success: false
                    errors:
                      - code: ERR300402
                        message: 組織が存在しません。
    delete:
      operationId: deleteLoginCompanyCodeManhoursStaffId
      summary: 工数削除。
      tags:
        - manhours
      description: |
        工数実績を削除する。

        `task_id` が指定無しなら全タスク工数を削除する。
      security: []
      parameters:
        - in: path
          name: login_company_code
          required: true
          description: 企業のログイン企業 ID。
          schema:
            type: string
        - in: path
          name: staff_id
          required: true
          description: 従業員 ID。
          schema:
            type: integer
      requestBody:
        description: 削除する工数の情報。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestDeleteManhoursStaffId'
            examples:
              normal:
                value:
                  token: xxxxxxxxxxxxxxxx
                  date: '20190803'
                  project_id: 100
                  task_id: 150
      responses:
        '200':
          description: 処理成功時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDeleteManhoursStaffId'
              examples:
                succeeded:
                  value:
                    success: true
                    response:
                      staff_id: 200
                      date: '2019-08-03'
                      project_id: 100
                      daily_hour_items:
                        - task_id: 150
                          minute: 60
        default:
          description: 処理失敗時。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseFailure'
              examples:
                processingFailed:
                  value:
                    success: false
                    errors:
                      - code: ERR300402
                        message: 組織が存在しません。
  /{login_company_code}/multiple_stamps:
    get:
      operationId: getLoginCompanyCodeMultipleStamps
      summary: 打刻情報取得 (複数従業員)。
      tags:
        - stamps
      description: |
        管理下の複数人の従業員の特定期間の打刻情報を取得する。

        開始日時、終了日時で指定できる最長期間は 1 日まで。また 1 回のリクエストで取得できる打刻は 1,000 件まで。従業員 ID は最大 50 人まで指定できる。
      security:
        - tokenQuery: []
      parameters:
        - in: path
          name: login_company_code
          required: true
          description: 企業のログイン企業 ID。
          schema:
            type: string
        - in: query
          name: start_date
          required: true
          description: 打刻取得期間の開始日時。yyyymmddHHMMSS の形式で指定する。
          schema:
            type: string
          example: '20170501000000'
        - in: query
          name: end_date
          required: true
          description: 打刻取得期間の終了日時。yyyymmddHHMMSS の形式で指定する。 開始日時、終了日時で指定できる最長期間は 1 日まで。 また 1 回のリクエストで取得できる打刻は 1,000 件まで。
          schema:
            type: string
          example: '20170502000000'
        - in: query
          name: staff_ids
          required: true
