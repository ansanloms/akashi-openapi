type: object
description: 打刻情報取得のレスポンス。
required:
  - success
properties:
  success:
    type: boolean
    description: 処理の成功失敗を示す。成功の場合は true、失敗の場合は false。
  response:
    type: object
    description: 処理結果のオブジェクト。
    properties:
      login_company_code:
        type: string
        description: ログイン企業 ID。
      staff_id:
        type: integer
        description: 従業員 ID。
      count:
        type: integer
        description: 従業員の打刻数。
      stamps:
        type: array
        description: 打刻データの配列。
        items:
          $ref: ./Stamp.yaml
  errors:
    type: array
    description: 失敗の原因となったエラーメッセージの配列。
    items:
      $ref: ./Error.yaml
