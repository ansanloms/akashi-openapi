type: object
description: 勤務実績取得 (複数従業員) のレスポンス。
required:
  - success
properties:
  success:
    type: boolean
    description: 処理の成功失敗を示す。成功の場合は true、失敗の場合は false。
  response:
    type: array
    description: 従業員ごとの勤務実績情報の配列。
    items:
      $ref: ./StaffWorkingRecord.yaml
  errors:
    type: array
    description: 失敗の原因となったエラーメッセージの配列。
    items:
      $ref: ./Error.yaml
