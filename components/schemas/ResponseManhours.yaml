    description: 処理結果のオブジェクト。
    properties:
      manhours:
        type: array
        description: 工数の配列。
        items:
          $ref: ./Manhour.yaml
  errors:
    type: array
    description: 失敗の原因となったエラーメッセージの配列。
    items:
      $ref: ./Error.yaml
