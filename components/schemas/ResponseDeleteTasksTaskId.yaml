type: object
description: タスク削除のレスポンス。
required:
  - success
properties:
  success:
    type: boolean
    description: 処理の成功失敗を示す。成功の場合は true、失敗の場合は false。
  response:
    type: object
    description: 削除したタスク。
    properties:
      task_id:
        type: integer
        description: タスク ID。
      name:
        type: string
        description: タスク名称。
      code:
        type:
          - string
          - "null"
        description: タスクコード。
  errors:
    type: array
    description: 失敗の原因となったエラーメッセージの配列。
    items:
      $ref: ./Error.yaml
