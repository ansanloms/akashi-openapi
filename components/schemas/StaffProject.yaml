type: object
description:
  $ref: "./descriptions/StaffProject.md"
properties:
  project_id:
    type: integer
    description: プロジェクト ID。
  start_date:
    type:
      - string
      - "null"
    description: プロジェクト開始日。
    example: 2019-08-01
