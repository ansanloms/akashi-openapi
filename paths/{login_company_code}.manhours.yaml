get:
  operationId: getManhours
  summary: 工数取得 (一覧)。
  tags:
    - manhours
  description:
    $ref: ./descriptions/getManhours.md
  security:
    - tokenQuery: []
  parameters:
    - in: path
      name: login_company_code
      required: true
      description: 企業のログイン企業 ID。
      schema:
        type: string
    - in: query
      name: start_date
      required: false
      description: 工数取得期間の開始日時。指定無しなら実行月の月初日を選択する。
      schema:
        type: string
      example: "20190801"
    - in: query
      name: end_date
      required: false
      description: 工数取得期間の終了日時。指定無しなら実行月の月末日を選択する。
      schema:
        type: string
      example: "20190831"
  responses:
    200:
      description: 処理成功時。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseManhours.yaml
          examples:
            succeeded:
              value:
                $ref: ../examples/ResponseManhours.yaml
    default:
      description: 処理失敗時。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            processingFailed:
              value:
                $ref: ../examples/ResponseFailure.yaml
post:
  operationId: postManhours
  summary: 工数作成更新。
  tags:
    - manhours
  description:
    $ref: ./descriptions/postManhours.md
  security: []
  parameters:
    - in: path
      name: login_company_code
      required: true
      description: 企業のログイン企業 ID。
      schema:
        type: string
  requestBody:
    description: 作成、または更新する工数の情報。
    content:
      application/json:
        schema:
          $ref: ../components/schemas/RequestPostManhours.yaml
        examples:
          normal:
            value:
              $ref: ../examples/RequestPostManhours.yaml
  responses:
    200:
      description: 処理成功時。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseManhours.yaml
          examples:
            succeeded:
              value:
                $ref: ../examples/ResponseManhours.yaml
    default:
      description: 処理失敗時。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            processingFailed:
              value:
                $ref: ../examples/ResponseFailure.yaml
