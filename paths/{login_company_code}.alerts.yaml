get:
  operationId: getAlerts
  summary: アラート情報取得。
  tags:
    - alerts
  description:
    $ref: ./descriptions/getAlerts.md
  security:
    - tokenQuery: []
  parameters:
    - in: path
      name: login_company_code
      required: true
      description: マネーフォワード クラウド勤怠 Plus 企業 ID。
      schema:
        type: string
  responses:
    200:
      description: 処理成功時。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseGetAlerts.yaml
          examples:
            succeeded:
              value:
                $ref: ../examples/ResponseGetAlerts.yaml
    default:
      description: 処理失敗時。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            processingFailed:
              value:
                $ref: ../examples/ResponseFailure.yaml
