post:
  operationId: postLoginCompanyCodeImporterFactoryOrganizations
  summary: 異動日を指定した異動。
  tags:
    - importerFactory
  description:
    $ref: ./descriptions/postLoginCompanyCodeImporterFactoryOrganizations.md
  security: []
  parameters:
    - in: path
      name: login_company_code
      required: true
      description: 企業のログイン企業 ID。
      schema:
        type: string
  requestBody:
    description: 異動の情報。
    content:
      application/json:
        schema:
          $ref: ../components/schemas/RequestPostImporterFactoryOrganizations.yaml
        examples:
          normal:
            value:
              $ref: ../examples/RequestPostImporterFactoryOrganizations/default.yaml
  responses:
    200:
      description: 処理成功時。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseStaffs.yaml
          examples:
            succeeded:
              value:
                $ref: ../examples/ResponseStaffs/default.yaml
    default:
      description: 処理失敗時。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            processingFailed:
              value:
                $ref: ../examples/ResponseFailure/default.yaml
