patch:
  operationId: patchLoginCompanyCodeWorkingConditionSettings
  summary: 個別就業設定。
  tags:
    - workingConditionSettings
  description:
    $ref: ./descriptions/patchLoginCompanyCodeWorkingConditionSettings.md
  security: []
  parameters:
    - in: path
      name: login_company_code
      required: true
      description: 企業のログイン企業 ID。
      schema:
        type: string
  requestBody:
    description: 設定する個別就業設定の情報。
    content:
      application/json:
        schema:
          $ref: ../components/schemas/RequestPatchWorkingConditionSettings.yaml
        examples:
          normal:
            value:
              $ref: ../examples/RequestPatchWorkingConditionSettings/default.yaml
  responses:
    200:
      description: 処理成功時。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseStaffs.yaml
          examples:
            succeeded:
              value:
                $ref: ../examples/ResponseStaffs/default.yaml
    default:
      description: 処理失敗時。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            processingFailed:
              value:
                $ref: ../examples/ResponseFailure/default.yaml
